apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This overlay is used only by the disposable Kind experiment. It keeps the
# manager image selection out of the production manifests.
resources:
- ../default

images:
- name: controller
  newName: reconciler-handbook-manager
  newTag: production-evidence

patches:
- target:
    kind: Deployment
    name: controller-manager
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: Never
