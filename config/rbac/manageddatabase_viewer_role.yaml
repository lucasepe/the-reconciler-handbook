# This rule is not used by the project reconciler-handbook itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to data.example.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: reconciler-handbook
    app.kubernetes.io/managed-by: kustomize
  name: manageddatabase-viewer-role
rules:
- apiGroups:
  - data.example.io
  resources:
  - manageddatabases
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - data.example.io
  resources:
  - manageddatabases/status
  verbs:
  - get
