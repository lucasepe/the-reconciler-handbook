# This rule is not used by the project reconciler-handbook itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over data.example.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: reconciler-handbook
    app.kubernetes.io/managed-by: kustomize
  name: manageddatabase-admin-role
rules:
- apiGroups:
  - data.example.io
  resources:
  - manageddatabases
  verbs:
  - '*'
- apiGroups:
  - data.example.io
  resources:
  - manageddatabases/status
  verbs:
  - get
